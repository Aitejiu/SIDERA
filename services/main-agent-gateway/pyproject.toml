[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidera-main-agent-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.134,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sidera-runtime-guard",
    "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
akashic = ["akashic-agent-sdk"]
demo = ["sidera-akashic-task-bridge"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "genai-prices==0.0.71",
    "pyright>=1.1.403,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
akashic-agent-sdk = { path = "../../akashic-agent/sdk/python", editable = true }
sidera-akashic-task-bridge = { path = "../../integrations/akashic", editable = true }
sidera-runtime-guard = { path = "../../packages/runtime-guard", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sidera_main_agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises live or cross-service integration boundaries",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
extraPaths = ["akashic-agent", "akashic-agent/sdk/python/src"]
