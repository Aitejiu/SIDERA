[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidera-main-agent-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "akashic-agent-sdk",
    "fastapi>=0.134,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.403,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
akashic-agent-sdk = { path = "../../akashic-agent/sdk/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sidera_main_agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
