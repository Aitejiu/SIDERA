[project]
name = "sidera-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.134,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "sidera-runtime-guard",
    "uvicorn>=0.41,<1",
]

[project.scripts]
sidera-plan-transition-worker = "sidera_control_plane.plan_transition_worker:main"
sidera-handoff-worker = "sidera_control_plane.handoff_worker:main"
sidera-collaboration-worker = "sidera_control_plane.collaboration_worker:main"
sidera-collaboration-readiness = "sidera_control_plane.collaboration_readiness:main"
sidera-notification-worker = "sidera_control_plane.notification_worker:main"
sidera-notification-readiness = "sidera_control_plane.notification_readiness:main"
sidera-result-worker = "sidera_control_plane.result_worker:main"

[dependency-groups]
dev = [
    "httpx2>=2.3,<3",
    "numpy>=2.4,<3",
    "pyright>=1.1.403,<2",
    "pytest>=9,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidera_control_plane"]

[tool.uv.sources]
sidera-runtime-guard = { path = "../../packages/runtime-guard", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
