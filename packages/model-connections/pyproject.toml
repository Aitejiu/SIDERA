[project]
name = "sidera-model-connections"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
postgres = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
]
macos = ["pyobjc-framework-Security==12.2.2; sys_platform == 'darwin'"]
http = ["fastapi>=0.115,<1"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidera_model_connections"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "sidera_model_connections/alembic.ini"
"migrations" = "sidera_model_connections/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
